<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Cây Thư Mục Click Đóng Mở</title>
    <style>
        .tree {
            --spacing: 1.5rem;
            --radius: 5px;
            padding-left: 10px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none; /* Ngăn bôi đen văn bản khi click nhanh */
        }
        .tree ul {
            margin-left: calc(var(--spacing) - var(--radius));
            padding-left: 0;
            list-style: none;
        }
        .tree li {
            display: block;
            position: relative;
            padding-left: calc(var(--spacing) + 5px);
            margin: 5px 0;
        }
        /* Tạo đường thẳng dọc */
        .tree ul li::before {
            content: "";
            position: absolute;
            top: calc(var(--spacing) / -2);
            left: 0;
            border-left: 1px solid #ccc;
            width: 1px;
            height: calc(var(--spacing) + 8px);
        }
        .tree ul li:last-child::before {
            height: calc(var(--spacing) / 2 + 5px);
        }
        /* Tạo đường thẳng ngang */
        .tree ul li::after {
            content: "";
            position: absolute;
            top: calc(var(--spacing) / 2 + 3px);
            left: 0;
            border-top: 1px solid #ccc;
            width: var(--spacing);
            height: 1px;
        }

        /* Định dạng Folder và File */
        .folder { font-weight: 600; color: #f5b041; cursor: pointer; }
        .file { color: #566573; }

        /* Ẩn các thư mục con mặc định khi bị đóng */
        .nested {
            display: none;
        }
        /* Hiển thị lại khi có class active */
        .active {
            display: block;
        }
        
    </style>
</head>
<body>

    <h2>Cây thư mục tương tác (Click Folder)</h2>
    <div class="tree">
        <ul>
            <li>
                <!-- Mặc định icon là 📁 -->
                <span class="folder" data-opened="true">📁 Lop 10</span>
                <!-- Thêm class "nested" để ẩn danh sách con ban đầu -->
                <ul class="nested active">
                    <li><span class="folder" data-opened="true">📁Dai so</span>
                        <ul class="nested">
                            <li><span class="folder" data-opened="true">📁 Chuong 1</span>
                                <ul class="nested">
                                    <li>     <a href="https://www.youtube.com/watch?v=wHWmgZ5B7pw"
       target="_blank"
       rel="noopener noreferrer">
       <span class="file">📄 Bài 1: abc</span> 
    </a> </li>
                                    <li><span class="file">📄 responsive.css</span></li>
                                </ul>
                            </li>
                            <li><span class="folder" data-opened="false">📁 images</span>
                                <ul class="nested">
                                    <li><span class="file">🖼️ logo.svg</span></li>
                                </ul>
                            </li>
                        </ul>
                    </li>
                    <li><span class="file">📄 index.html</span></li>
                    <li><span class="file">📄 about.html</span></li>
                </ul>
            </li>
        </ul>
    </div>

    <!-- Đoạn JavaScript xử lý hành động click -->
    <script>
        document.querySelector('.tree').addEventListener('click', function(e) {
            // Kiểm tra xem phần tử được click có phải là folder không
            if (e.target.classList.contains('folder')) {
                
                // Tìm danh sách ul (thư mục con) đứng ngay sau folder được click
                const childList = e.target.parentElement.querySelector('.nested');
                
                if (childList) {
                    // Bật/tắt class 'active' để ẩn/hiển thị
                    childList.classList.toggle('active');
                    
                    // Đổi icon thư mục dựa trên trạng thái đóng/mở
                    const isOpened = e.target.getAttribute('data-opened') === 'true';
                    if (isOpened) {
                        e.target.innerHTML = e.target.innerHTML.replace('📂', '📁');
                        e.target.setAttribute('data-opened', 'false');
                    } else {
                        e.target.innerHTML = e.target.innerHTML.replace('📁', '📂');
                        e.target.setAttribute('data-opened', 'true');
                    }
                }
            }
        });
    </script>

</body>
</html>
